name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No API credentials in CI. Every test must run offline -- the suite asserts this by
  # passing explicit env mappings rather than reading the process environment.
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # [dev] alone cannot run the suite: tests/test_app.py imports fastapi and
      # tests/test_simulator_forever.py imports simulator.run, which imports httpx -- both come
      # from [app]. [warehouse] is needed too, from this phase onward, because
      # fleet_telemetry.load.schema (tests/test_bronze_load.py) imports psycopg.
      - run: pip install -e ".[app,warehouse,dev]"
      - run: pytest

  dbt:
    runs-on: ubuntu-latest
    services:
      # PostGIS image rather than plain postgres: the models use GEOMETRY columns and
      # ST_DWithin, so a build against vanilla Postgres would pass while the real one fails.
      # TimescaleDB is absent here; hypertable creation must therefore be guarded so `dbt
      # build` succeeds without it.
      warehouse:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: telemetry
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: telemetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # 127.0.0.1 rather than localhost, matching dbt/profiles.yml -- see the note there.
      WAREHOUSE_HOST: 127.0.0.1
      # The service container publishes 5432 here, unlike the local compose stack which uses
      # 55432 to dodge a crowded host. Set explicitly so the profile default does not apply.
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: telemetry
      WAREHOUSE_USER: telemetry
      WAREHOUSE_PASSWORD: telemetry

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[warehouse]"

      - name: Create medallion schemas
        run: |
          PGPASSWORD=telemetry psql -h localhost -U telemetry -d telemetry \
            -c "CREATE SCHEMA IF NOT EXISTS bronze;" \
            -c "CREATE SCHEMA IF NOT EXISTS silver;" \
            -c "CREATE SCHEMA IF NOT EXISTS gold;" \
            -c "CREATE SCHEMA IF NOT EXISTS marts;" \
            -c "CREATE SCHEMA IF NOT EXISTS truth;"

      # Bronze is owned by the Python loader, not by dbt, so these tables do not exist until
      # this runs -- and the source tests added in phase 2 would fail the build without them.
      # It needs no broker and no data: the tests assert not_null and unique, which hold
      # vacuously on an empty table and would still catch a column that went missing.
      - name: Apply the bronze schema
        run: python -m fleet_telemetry.load.schema

      # Same reasoning as bronze above. truth.intended_pings is owned by
      # src/fleet_telemetry/truth.py, not by dbt, so it does not exist until this runs -- and
      # `dbt build` evaluates source tests EAGERLY, so the not_null tests on it would fail the
      # build rather than report anything useful (dbt/models/staging/_sources.yml:6-9).
      #
      # Empty is the correct state here: the simulator never runs in CI, so nothing writes to this
      # table and the ground-truth diff returns no rows because every frontier is null. That is
      # said out loud in the test itself, because a green check reads like coverage and is not.
      - name: Apply the truth schema
        run: python -m fleet_telemetry.truth

      # PROVES THE SQL PARSES AND RUNS. IT PROVES NOTHING ABOUT THE NUMBERS.
      #
      # Bronze is empty here, so every script produces zero rows, every cast is exercised against
      # nothing, and every reconciliation holds vacuously. What this does catch is the class of
      # error that cost the most time to find by hand: a column renamed in load/schema.py without
      # sql/silver being updated, a typo, a function that does not exist on this PostGIS build.
      #
      # Said out loud because a green check here reads like coverage and is not. The properties
      # that matter -- the grain, the reconciliation, the lat/lon orientation -- are asserted in
      # tests/test_transform.py, which needs a populated database and therefore does not run in CI.
      - name: Run the hand-written Silver scripts
        run: python -m fleet_telemetry.transform.run

      - name: dbt parse
        run: dbt parse --project-dir dbt --profiles-dir dbt --target ci

      # Runs models and every test, including the grain assertions. Fan-out is invisible
      # without them, so this is the step that actually protects the numbers.
      - name: dbt build
        run: dbt build --project-dir dbt --profiles-dir dbt --target ci
