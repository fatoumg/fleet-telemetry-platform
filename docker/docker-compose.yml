# Two databases, deliberately separate.
#
#   oltp       what the application writes to. Plain Postgres, normalised, current-state only.
#   warehouse  what analytics reads. Postgres + PostGIS + TimescaleDB, dimensional, keeps history.
#
# THEY MUST NOT BE THE SAME DATABASE. An application bug must not be able to corrupt analytics;
# an analyst's runaway scan must not be able to slow down the app; and the two have completely
# different backup and uptime needs. Pointing a BI tool straight at the production OLTP is the
# specific anti-pattern this whole project exists to replace.
#
# Redpanda and Debezium arrive in phase 2, Airflow (with its own third database) in phase 4.
#
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f oltp

name: fleet-telemetry

services:
  # ------------------------------------------------------------------------------------
  # OLTP -- the source system
  # ------------------------------------------------------------------------------------
  oltp:
    # Alpine: same Postgres 16, ~400 MB instead of ~1 GB. The OLTP side needs no
    # extensions, so there is nothing the slim image lacks.
    image: postgres:16-alpine
    container_name: fleet-oltp
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OLTP_DB:-fleet}
      POSTGRES_USER: ${OLTP_USER:-fleet}
      POSTGRES_PASSWORD: ${OLTP_PASSWORD:-fleet}
      TZ: UTC
      PGTZ: UTC
    # wal_level=logical is set NOW, in phase 1, even though nothing uses it until phase 2.
    #
    # Not premature: changing wal_level requires a RESTART of the database, so setting it
    # later means an interruption plus the risk of discovering it at the worst moment. It also
    # costs almost nothing until a replication slot actually exists. Debezium reads the
    # write-ahead log, and without this the WAL simply does not contain enough information to
    # reconstruct a row change -- you get "what block changed", not "this driver moved depot".
    command:
      - postgres
      - -c
      - wal_level=logical
      # One slot for Debezium, plus headroom. A slot that nobody consumes makes Postgres
      # retain WAL forever and eventually fills the disk -- a real and popular way to take an
      # instance down, so it is worth knowing the limit exists.
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    ports:
      # 55433, one above the warehouse, and far from the 5432 a locally installed Postgres holds.
      - "${OLTP_PORT:-55433}:5432"
    volumes:
      - oltp_data:/var/lib/postgresql/data
      # Runs once, only when the data directory is empty.
      - ./oltp/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_USER:-fleet} -d ${OLTP_DB:-fleet}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------------------------------
  # Warehouse -- Postgres + PostGIS + TimescaleDB (the timescaledb-ha image bundles both)
  # ------------------------------------------------------------------------------------
  warehouse:
    image: timescale/timescaledb-ha:pg16
    container_name: fleet-warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-telemetry}
      POSTGRES_USER: ${WAREHOUSE_USER:-telemetry}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-telemetry}
      # Keeps timestamps unambiguous; every source timestamp is UTC epoch seconds.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Host port 55432, deliberately far from 5432.
      #
      # 5432 is taken by a locally installed PostgreSQL service, and 5433/5435/5436 by other
      # Docker stacks. Worse, Windows lets a container bind a port a host service already
      # holds: both listen, clients silently reach the *host* server, and the symptom is
      # "password authentication failed for user telemetry" -- which reads as a credentials
      # bug, not a port collision. That cost real debugging time; hence a port nothing else
      # plausibly wants.
      #
      # Container-side stays 5432, so nothing inside the compose network changes. Override
      # with WAREHOUSE_PORT if 55432 is somehow taken too.
      - "${WAREHOUSE_PORT:-55432}:5432"
    volumes:
      - warehouse_data:/home/postgres/pgdata/data
      # Runs once, only when the data directory is empty.
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-telemetry} -d ${WAREHOUSE_DB:-telemetry}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  warehouse_data:
    name: fleet-warehouse-data
  oltp_data:
    name: fleet-oltp-data
