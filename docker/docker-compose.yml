# The whole source system: two databases, the application, and the world that drives it.
#
#   oltp       what the application writes to. Plain Postgres, normalised, current-state only.
#   warehouse  what analytics reads. Postgres + PostGIS + TimescaleDB, dimensional, keeps history.
#   api        the fleet application
#   simulator  stands in for real vehicles. Runs continuously; see the note on its service.
#
# THEY MUST NOT BE THE SAME DATABASE. An application bug must not be able to corrupt analytics;
# an analyst's runaway scan must not be able to slow down the app; and the two have completely
# different backup and uptime needs. Pointing a BI tool straight at the production OLTP is the
# specific anti-pattern this whole project exists to replace.
#
# Redpanda and Debezium arrive in phase 2, Airflow (with its own third database) in phase 4.
#
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f simulator
#   docker compose -f docker/docker-compose.yml stop simulator     # pause the world
#
# Only want the databases, and to run the app by hand? Name them:
#
#   docker compose -f docker/docker-compose.yml up -d oltp warehouse

name: fleet-telemetry

services:
  # ------------------------------------------------------------------------------------
  # OLTP -- the source system
  # ------------------------------------------------------------------------------------
  oltp:
    # Alpine: same Postgres 16, ~400 MB instead of ~1 GB. The OLTP side needs no
    # extensions, so there is nothing the slim image lacks.
    image: postgres:16-alpine
    container_name: fleet-oltp
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OLTP_DB:-fleet}
      POSTGRES_USER: ${OLTP_USER:-fleet}
      POSTGRES_PASSWORD: ${OLTP_PASSWORD:-fleet}
      TZ: UTC
      PGTZ: UTC
    # wal_level=logical is set NOW, in phase 1, even though nothing uses it until phase 2.
    #
    # Not premature: changing wal_level requires a RESTART of the database, so setting it
    # later means an interruption plus the risk of discovering it at the worst moment. It also
    # costs almost nothing until a replication slot actually exists. Debezium reads the
    # write-ahead log, and without this the WAL simply does not contain enough information to
    # reconstruct a row change -- you get "what block changed", not "this driver moved depot".
    command:
      - postgres
      - -c
      - wal_level=logical
      # One slot for Debezium, plus headroom. A slot that nobody consumes makes Postgres
      # retain WAL forever and eventually fills the disk -- a real and popular way to take an
      # instance down, so it is worth knowing the limit exists.
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    ports:
      # 55433, one above the warehouse, and far from the 5432 a locally installed Postgres holds.
      - "${OLTP_PORT:-55433}:5432"
    volumes:
      - oltp_data:/var/lib/postgresql/data
      # Runs once, only when the data directory is empty.
      - ./oltp/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_USER:-fleet} -d ${OLTP_DB:-fleet}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------------------------------
  # Warehouse -- Postgres + PostGIS + TimescaleDB (the timescaledb-ha image bundles both)
  # ------------------------------------------------------------------------------------
  warehouse:
    image: timescale/timescaledb-ha:pg16
    container_name: fleet-warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-telemetry}
      POSTGRES_USER: ${WAREHOUSE_USER:-telemetry}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-telemetry}
      # Keeps timestamps unambiguous; every source timestamp is UTC epoch seconds.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Host port 55432, deliberately far from 5432.
      #
      # 5432 is taken by a locally installed PostgreSQL service, and 5433/5435/5436 by other
      # Docker stacks. Worse, Windows lets a container bind a port a host service already
      # holds: both listen, clients silently reach the *host* server, and the symptom is
      # "password authentication failed for user telemetry" -- which reads as a credentials
      # bug, not a port collision. That cost real debugging time; hence a port nothing else
      # plausibly wants.
      #
      # Container-side stays 5432, so nothing inside the compose network changes. Override
      # with WAREHOUSE_PORT if 55432 is somehow taken too.
      - "${WAREHOUSE_PORT:-55432}:5432"
    volumes:
      - warehouse_data:/home/postgres/pgdata/data
      # Runs once, only when the data directory is empty.
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-telemetry} -d ${WAREHOUSE_DB:-telemetry}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------------------------
  # API -- the fleet application
  # ------------------------------------------------------------------------------------
  api:
    build:
      # The project root, not docker/. The image needs src/, app/ and simulator/.
      context: ..
      dockerfile: docker/Dockerfile
    image: fleet-app:local
    container_name: fleet-api
    restart: unless-stopped
    depends_on:
      oltp:
        condition: service_healthy
    environment:
      # Inside the compose network services address each other by service name on the
      # CONTAINER port. The 55433 host mapping does not exist in here.
      OLTP_HOST: oltp
      OLTP_PORT: 5432
      OLTP_DB: ${OLTP_DB:-fleet}
      OLTP_USER: ${OLTP_USER:-fleet}
      OLTP_PASSWORD: ${OLTP_PASSWORD:-fleet}
      FLEET_API_TOKEN: ${FLEET_API_TOKEN:-local-dev-token}
      # Off, as everywhere else. Backfilling history is a deliberate act you perform against a
      # server you started for the purpose -- not a capability a long-running service holds.
      FLEET_ALLOW_SERVER_TS_OVERRIDE: ${FLEET_ALLOW_SERVER_TS_OVERRIDE:-false}
      TZ: UTC
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # /health returns 200 even when the database is unreachable -- it reports
      # status="degraded" in the body. Checking the status code alone would call a broken
      # API healthy and let the simulator start against it.
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          body = json.load(urllib.request.urlopen("http://127.0.0.1:8000/health"))
          sys.exit(0 if body["status"] == "ok" else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ------------------------------------------------------------------------------------
  # Simulator -- stands in for real vehicles, and therefore never stops
  # ------------------------------------------------------------------------------------
  #
  # This is not a scheduled job and phase 4's Airflow will not trigger it. It represents the
  # world: minibuses are out there driving whether or not the pipeline is up. Airflow will
  # orchestrate the things that CONSUME this data.
  #
  # DISK. At the defaults -- 10 vehicles, one ping each per 5 seconds -- this writes 2 rows a
  # second, about 173,000 a day, roughly 43 MB a day with indexes. That is a stack you can
  # leave running. The design's full fleet is 40, which is four times that and over a gigabyte
  # a week, so it is opt-in: set SIM_VEHICLES=40 when you actually want the volume.
  #
  # Stop it entirely with:
  #   docker compose -f docker/docker-compose.yml stop simulator
  simulator:
    # Reuses the api service's image rather than declaring its own `build:`. Two services
    # building the same tag makes buildx export it twice in parallel, and the second export
    # fails with `image "fleet-app:local": already exists`. Since simulator depends on api,
    # the image is always built by the time this starts.
    image: fleet-app:local
    container_name: fleet-simulator
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # It talks to the API for writes, and to the database directly for reads it needs at
      # startup: the depot list, the active vehicles, and where each sequence counter reached.
      OLTP_HOST: oltp
      OLTP_PORT: 5432
      OLTP_DB: ${OLTP_DB:-fleet}
      OLTP_USER: ${OLTP_USER:-fleet}
      OLTP_PASSWORD: ${OLTP_PASSWORD:-fleet}
      FLEET_API_TOKEN: ${FLEET_API_TOKEN:-local-dev-token}
      FLEET_API_URL: http://api:8000
      TZ: UTC
    command:
      - python
      - -m
      - simulator
      - --forever
      - --vehicles
      - "${SIM_VEHICLES:-10}"
      - --interval
      - "${SIM_INTERVAL:-5}"
    # Long enough for the current tick to finish and the summary to print. The simulator
    # handles SIGTERM; the default 10s would be tight if a batch were mid-flight.
    stop_grace_period: 20s

volumes:
  warehouse_data:
    name: fleet-warehouse-data
  oltp_data:
    name: fleet-oltp-data
