version: 2

# Unit tests for Gold. See dbt/models/staging/_unit_tests.yml for the format reasoning -- SQL
# fixtures rather than dict, explicit casts on every value, and why the name has to stay short.
#
# WHY THESE EXIST, AND IT IS NOT BECAUSE REAL DATA CANNOT REACH THE RULES. It can, now: measured
# against silver.stg_vehicle_versions, 4 vehicle events and 12 driver events are UPDATEs that moved
# no tracked attribute, so suppression does visible work on this volume. The reason these tests
# still earn their place is different and stronger:
#
#   NOTHING ELSE ASSERTS A VERSION COUNT. The three singular tests in dbt/tests/ check the grain
#   (one row per vehicle per valid_from), non-empty intervals, and at most one current version --
#   and ALL THREE PASS IDENTICALLY WITH SUPPRESSION ON, OFF, OR INVERTED. Deleting
#   `AND tracked IS DISTINCT FROM prev_tracked` from dim_vehicle.sql took the dimension from 103
#   rows to 107 at the time of writing, every one of them still uniquely keyed, still non-empty,
#   still one-current-each. The specific counts move as ingestion continues; the mechanism does
#   not -- removing the predicate always adds back exactly the model's suppressed no-op count. The
#   build stays green either way, and the dimension quietly claims changes that changed nothing.
#   These fixtures are the only thing that notices.
#
# The third test is here for a bug that was really in the first draft of this model, not for a
# hypothetical: see dim_vehicle.sql on why a delete has to break the suppression chain.
#
# AND THE ARGUMENT ABOVE APPLIES VERBATIM TO dim_driver, which is why the fourth test exists. Its
# three assertions in dbt/tests/ would all pass with its suppression predicate deleted -- 79 rows
# would have become 91 at the time of writing, by the 12 measured no-op driver UPDATEs, every one
# of them still uniquely keyed and one-current-each. Two models sharing a CTE chain do not share a
# test: an edit to dim_driver.sql alone was caught by nothing.
#
# It is deliberately NOT the vehicle fixture with renamed columns. It exercises phone -- the
# driver-specific column, genuinely nullable in the OLTP (docker/oltp/init.sql:83), and null on 15
# of the 79 versions in the built table at the time of writing -- across the boundary that real
# data has never crossed.
# Measured on this volume: 0 null-to-value and 0 value-to-null transitions, so the one thing the
# jsonb comparison is chosen FOR is the one thing Bronze cannot currently demonstrate. That is the
# original _unit_tests.yml argument, still live, on one column rather than on a whole model.

unit_tests:
  # Names kept short on purpose: dbt materialises a unit test as a relation, so the name is
  # subject to Postgres's 63-character identifier limit. The detail lives in description instead.
  - name: dim_vehicle_ignores_updates_that_change_nothing
    model: dim_vehicle
    description: >
      Four events for one vehicle: a create at depot 1, an UPDATE that moved only updated_at, a
      real reassignment to depot 2, and a second updated_at-only UPDATE. Two versions must come
      out, not four.

      An UPDATE that touches no tracked attribute still produces a Debezium event, and a
      dimension that versions it records a change that changed nothing. This is also the guard
      against a re-registered connector: it re-snapshots every row as op='r' with an after-image
      byte-identical to the version before it, and this rule discards those for free.

      Note what is NOT tracked and why: updated_at and created_at are excluded from the
      comparison deliberately. Including updated_at would make this rule a no-op, since it moves
      on every UPDATE by definition -- which is exactly what events 2 and 4 below do and nothing
      else.
    given:
      - input: ref('stg_vehicle_versions')
        format: sql
        rows: |
          SELECT 4201::integer AS vehicle_id,
                 'GM-4201-A'::text AS plate,
                 14::integer AS capacity,
                 'active'::text AS status,
                 7::integer AS current_driver_id,
                 1::integer AS home_depot_id,
                 '2026-08-01T08:00:00Z'::timestamptz AS created_at,
                 '2026-08-14T09:00:00Z'::timestamptz AS updated_at,
                 'c'::text AS bronze_op,
                 1786698000000::bigint AS source_ts_ms,
                 '2026-08-14T09:00:00Z'::timestamptz AS committed_at,
                 0::integer AS bronze_partition,
                 10::bigint AS bronze_offset
          UNION ALL
          -- updated_at only. Every tracked attribute is byte-identical to the row above.
          SELECT 4201::integer,
                 'GM-4201-A'::text,
                 14::integer,
                 'active'::text,
                 7::integer,
                 1::integer,
                 '2026-08-01T08:00:00Z'::timestamptz,
                 '2026-08-14T10:00:00Z'::timestamptz,
                 'u'::text,
                 1786701600000::bigint,
                 '2026-08-14T10:00:00Z'::timestamptz,
                 0::integer,
                 20::bigint
          UNION ALL
          -- The real reassignment: home_depot_id 1 -> 2. This one is a version.
          SELECT 4201::integer,
                 'GM-4201-A'::text,
                 14::integer,
                 'active'::text,
                 7::integer,
                 2::integer,
                 '2026-08-01T08:00:00Z'::timestamptz,
                 '2026-08-14T11:00:00Z'::timestamptz,
                 'u'::text,
                 1786705200000::bigint,
                 '2026-08-14T11:00:00Z'::timestamptz,
                 0::integer,
                 30::bigint
          UNION ALL
          -- updated_at only again, this time AFTER a real change, so a rule that compared against
          -- the first version rather than the previous one would also get this wrong.
          SELECT 4201::integer,
                 'GM-4201-A'::text,
                 14::integer,
                 'active'::text,
                 7::integer,
                 2::integer,
                 '2026-08-01T08:00:00Z'::timestamptz,
                 '2026-08-14T12:00:00Z'::timestamptz,
                 'u'::text,
                 1786708800000::bigint,
                 '2026-08-14T12:00:00Z'::timestamptz,
                 0::integer,
                 40::bigint
    expect:
      format: sql
      rows: |
        SELECT 4201::integer AS vehicle_id,
               'GM-4201-A'::text AS plate,
               14::integer AS capacity,
               'active'::text AS status,
               7::integer AS current_driver_id,
               1::integer AS home_depot_id,
               '2026-08-01T08:00:00Z'::timestamptz AS created_at,
               '2026-08-14T09:00:00Z'::timestamptz AS valid_from,
               -- Closes at 11:00, the REAL change -- not at 10:00, the no-op. That is the
               -- assertion: a suppressed event must not shorten the interval it sits inside.
               '2026-08-14T11:00:00Z'::timestamptz AS valid_to,
               false AS is_current,
               false AS is_deleted,
               false AS valid_from_is_observation_start,
               'c'::text AS source_op,
               1786698000000::bigint AS source_ts_ms,
               0::integer AS bronze_partition,
               10::bigint AS bronze_offset
        UNION ALL
        SELECT 4201::integer,
               'GM-4201-A'::text,
               14::integer,
               'active'::text,
               7::integer,
               2::integer,
               '2026-08-01T08:00:00Z'::timestamptz,
               '2026-08-14T11:00:00Z'::timestamptz,
               NULL::timestamptz,
               true,
               false,
               false,
               'u'::text,
               1786705200000::bigint,
               0::integer,
               30::bigint

  - name: dim_vehicle_delete_closes_the_final_interval
    model: dim_vehicle
    description: >
      Three events: a create, a reassignment, and a delete. Two versions must come out. The
      second must have valid_to equal to the delete's commit time, is_current false, and
      is_deleted true -- and no row may exist for the delete itself.

      DELETE /vehicles/{id} is a hard delete on purpose (CLAUDE.md), so this is the case that
      distinguishes "we stopped seeing this vehicle" from "this vehicle was removed on the 14th",
      and only the second is a fact. The delete row's after-image is null and its before-image is
      untrustworthy on any volume created before 2026-08-12 (docs/known-issues.md, section 1) --
      the fixture supplies every attribute as null to prove the model never reads them.
    given:
      - input: ref('stg_vehicle_versions')
        format: sql
        rows: |
          SELECT 4202::integer AS vehicle_id,
                 'GM-4202-B'::text AS plate,
                 18::integer AS capacity,
                 'active'::text AS status,
                 NULL::integer AS current_driver_id,
                 1::integer AS home_depot_id,
                 '2026-08-01T08:00:00Z'::timestamptz AS created_at,
                 '2026-08-14T09:00:00Z'::timestamptz AS updated_at,
                 'c'::text AS bronze_op,
                 1786698000000::bigint AS source_ts_ms,
                 '2026-08-14T09:00:00Z'::timestamptz AS committed_at,
                 0::integer AS bronze_partition,
                 50::bigint AS bronze_offset
          UNION ALL
          SELECT 4202::integer,
                 'GM-4202-B'::text,
                 18::integer,
                 'active'::text,
                 NULL::integer,
                 2::integer,
                 '2026-08-01T08:00:00Z'::timestamptz,
                 '2026-08-14T10:00:00Z'::timestamptz,
                 'u'::text,
                 1786701600000::bigint,
                 '2026-08-14T10:00:00Z'::timestamptz,
                 0::integer,
                 60::bigint
          UNION ALL
          -- The delete. Every attribute null, exactly as stg_vehicle_versions projects one, so a
          -- model that read the after-image here would produce an all-null version rather than
          -- silently borrowing plausible values.
          SELECT 4202::integer,
                 NULL::text,
                 NULL::integer,
                 NULL::text,
                 NULL::integer,
                 NULL::integer,
                 NULL::timestamptz,
                 NULL::timestamptz,
                 'd'::text,
                 1786705200000::bigint,
                 '2026-08-14T11:00:00Z'::timestamptz,
                 0::integer,
                 70::bigint
    expect:
      format: sql
      rows: |
        SELECT 4202::integer AS vehicle_id,
               'GM-4202-B'::text AS plate,
               18::integer AS capacity,
               'active'::text AS status,
               NULL::integer AS current_driver_id,
               1::integer AS home_depot_id,
               '2026-08-01T08:00:00Z'::timestamptz AS created_at,
               '2026-08-14T09:00:00Z'::timestamptz AS valid_from,
               '2026-08-14T10:00:00Z'::timestamptz AS valid_to,
               false AS is_current,
               false AS is_deleted,
               false AS valid_from_is_observation_start,
               'c'::text AS source_op,
               1786698000000::bigint AS source_ts_ms,
               0::integer AS bronze_partition,
               50::bigint AS bronze_offset
        UNION ALL
        -- The final version. is_current FALSE even though no version follows it: the vehicle
        -- stopped existing, which is not the same as still being current, and this is the
        -- distinction the whole dimension is for.
        SELECT 4202::integer,
               'GM-4202-B'::text,
               18::integer,
               'active'::text,
               NULL::integer,
               2::integer,
               '2026-08-01T08:00:00Z'::timestamptz,
               '2026-08-14T10:00:00Z'::timestamptz,
               '2026-08-14T11:00:00Z'::timestamptz,
               false,
               true,
               false,
               'u'::text,
               1786701600000::bigint,
               0::integer,
               60::bigint

  - name: dim_vehicle_recreate_after_delete_is_a_version
    model: dim_vehicle
    description: >
      Create, hard delete, then a re-create of the SAME id carrying byte-identical tracked
      attributes. Two versions must come out, not one.

      THIS PINS A BUG THAT WAS REALLY WRITTEN. The first draft of this model ran lag() over the
      non-delete rows only, on the stated grounds that vehicle_id is a serial and ids are never
      reused, so nothing can follow a delete. That is false in this database: tests/test_app.py:37
      pins TEST_VEHICLE_ID = 9101 and tests/test_poller.py:102-103 pin 9401, both inserted and
      hard-deleted on every run (docs/known-issues.md, section 3). Measured against Bronze: those
      two ids carry six delete events each -- twelve lifecycles between them, ten of which begin
      AFTER a delete of the same id. Because each re-create repeats the previous fixture's plate,
      capacity, status and depot, the suppression rule saw no change and discarded five of the six
      lifecycles per id -- 103 versions became 93, and every test still passed.

      The fix, and what this fixture asserts: tracked is NULL on a delete row and the window runs
      over ALL events, so the re-create compares against NULL, is distinct from it, and survives.
      Note this test also passes with suppression removed entirely -- it is the guard against
      re-introducing the ORIGINAL rule, and the other two tests are what require the rule to be
      there at all. All three together pin the one form that is right.
    given:
      - input: ref('stg_vehicle_versions')
        format: sql
        rows: |
          SELECT 9401::integer AS vehicle_id,
                 'TEST-9401'::text AS plate,
                 8::integer AS capacity,
                 'active'::text AS status,
                 NULL::integer AS current_driver_id,
                 1::integer AS home_depot_id,
                 '2026-08-14T09:00:00Z'::timestamptz AS created_at,
                 '2026-08-14T09:00:00Z'::timestamptz AS updated_at,
                 'c'::text AS bronze_op,
                 1786698000000::bigint AS source_ts_ms,
                 '2026-08-14T09:00:00Z'::timestamptz AS committed_at,
                 0::integer AS bronze_partition,
                 80::bigint AS bronze_offset
          UNION ALL
          SELECT 9401::integer,
                 NULL::text,
                 NULL::integer,
                 NULL::text,
                 NULL::integer,
                 NULL::integer,
                 NULL::timestamptz,
                 NULL::timestamptz,
                 'd'::text,
                 1786701600000::bigint,
                 '2026-08-14T10:00:00Z'::timestamptz,
                 0::integer,
                 90::bigint
          UNION ALL
          -- The next run of the same test. Same id, same tracked attributes, a new row in the
          -- OLTP -- only created_at gives it away, and created_at is deliberately not tracked.
          SELECT 9401::integer,
                 'TEST-9401'::text,
                 8::integer,
                 'active'::text,
                 NULL::integer,
                 1::integer,
                 '2026-08-14T11:00:00Z'::timestamptz,
                 '2026-08-14T11:00:00Z'::timestamptz,
                 'c'::text,
                 1786705200000::bigint,
                 '2026-08-14T11:00:00Z'::timestamptz,
                 0::integer,
                 100::bigint
    expect:
      format: sql
      rows: |
        SELECT 9401::integer AS vehicle_id,
               'TEST-9401'::text AS plate,
               8::integer AS capacity,
               'active'::text AS status,
               NULL::integer AS current_driver_id,
               1::integer AS home_depot_id,
               '2026-08-14T09:00:00Z'::timestamptz AS created_at,
               '2026-08-14T09:00:00Z'::timestamptz AS valid_from,
               '2026-08-14T10:00:00Z'::timestamptz AS valid_to,
               false AS is_current,
               true AS is_deleted,
               false AS valid_from_is_observation_start,
               'c'::text AS source_op,
               1786698000000::bigint AS source_ts_ms,
               0::integer AS bronze_partition,
               80::bigint AS bronze_offset
        UNION ALL
        SELECT 9401::integer,
               'TEST-9401'::text,
               8::integer,
               'active'::text,
               NULL::integer,
               1::integer,
               '2026-08-14T11:00:00Z'::timestamptz,
               '2026-08-14T11:00:00Z'::timestamptz,
               NULL::timestamptz,
               true,
               false,
               false,
               'c'::text,
               1786705200000::bigint,
               0::integer,
               100::bigint

  - name: dim_driver_versions_a_phone_change_not_a_no_op
    model: dim_driver
    description: >
      Three events for one driver: a create with NO phone number, an UPDATE that supplies one, and
      an UPDATE that moves only updated_at. Two versions must come out, not three and not one.

      TWO ASSERTIONS IN ONE FIXTURE, because they are the two halves of the same rule.

      Acquiring a phone number IS a change. The comparison is jsonb rather than a chain of `<>`
      precisely so that null participates: jsonb_build_object('phone', NULL) yields
      {"phone": null}, and `IS DISTINCT FROM` an object carrying a real number. Written with `<>`
      instead, the comparison would be NULL, the row would be discarded, and the driver would
      appear to have held this number from creation. Real data cannot catch that today -- phone
      was null on 15 of 79 versions at the time of writing, but measured 0 null-to-value and 0
      value-to-null transitions, so the boundary is crossed here and nowhere else.

      The third event is the suppression rule on the driver side. Without it dim_driver emits 91
      rows instead of 79 (at the time of writing) and all three of its assertions in dbt/tests/
      still pass; this fixture is the only thing that notices.
    given:
      - input: ref('stg_driver_versions')
        format: sql
        rows: |
          SELECT 9002::integer AS driver_id,
                 'Awa Ceesay'::text AS full_name,
                 -- No phone number on creation. An ABSENT number, not an empty one -- the
                 -- distinction stg_drivers.sql:12-14 refuses to collapse by coalescing to ''.
                 NULL::text AS phone,
                 'active'::text AS status,
                 1::integer AS home_depot_id,
                 '2026-08-01T08:00:00Z'::timestamptz AS created_at,
                 '2026-08-14T09:00:00Z'::timestamptz AS updated_at,
                 'c'::text AS bronze_op,
                 1786698000000::bigint AS source_ts_ms,
                 '2026-08-14T09:00:00Z'::timestamptz AS committed_at,
                 0::integer AS bronze_partition,
                 110::bigint AS bronze_offset
          UNION ALL
          -- The number arrives. NULL -> value is the transition Bronze has never contained.
          SELECT 9002::integer,
                 'Awa Ceesay'::text,
                 '+2207654321'::text,
                 'active'::text,
                 1::integer,
                 '2026-08-01T08:00:00Z'::timestamptz,
                 '2026-08-14T10:00:00Z'::timestamptz,
                 'u'::text,
                 1786701600000::bigint,
                 '2026-08-14T10:00:00Z'::timestamptz,
                 0::integer,
                 120::bigint
          UNION ALL
          -- updated_at only. Same name, same number, same status, same depot.
          SELECT 9002::integer,
                 'Awa Ceesay'::text,
                 '+2207654321'::text,
                 'active'::text,
                 1::integer,
                 '2026-08-01T08:00:00Z'::timestamptz,
                 '2026-08-14T11:00:00Z'::timestamptz,
                 'u'::text,
                 1786705200000::bigint,
                 '2026-08-14T11:00:00Z'::timestamptz,
                 0::integer,
                 130::bigint
    expect:
      format: sql
      rows: |
        SELECT 9002::integer AS driver_id,
               'Awa Ceesay'::text AS full_name,
               -- The phoneless version SURVIVES. Under a `<>` comparison this row is the one that
               -- disappears, and its disappearance is invisible in every aggregate.
               NULL::text AS phone,
               'active'::text AS status,
               1::integer AS home_depot_id,
               '2026-08-01T08:00:00Z'::timestamptz AS created_at,
               '2026-08-14T09:00:00Z'::timestamptz AS valid_from,
               '2026-08-14T10:00:00Z'::timestamptz AS valid_to,
               false AS is_current,
               false AS is_deleted,
               false AS valid_from_is_observation_start,
               'c'::text AS source_op,
               1786698000000::bigint AS source_ts_ms,
               0::integer AS bronze_partition,
               110::bigint AS bronze_offset
        UNION ALL
        -- Open-ended: the no-op UPDATE at 11:00 must not close this interval, and must not open
        -- one of its own.
        SELECT 9002::integer,
               'Awa Ceesay'::text,
               '+2207654321'::text,
               'active'::text,
               1::integer,
               '2026-08-01T08:00:00Z'::timestamptz,
               '2026-08-14T10:00:00Z'::timestamptz,
               NULL::timestamptz,
               true,
               false,
               false,
               'u'::text,
               1786701600000::bigint,
               0::integer,
               120::bigint
