version: 2

# Bronze tables, owned by the Python loader (src/aviation_conflict/load/), not by dbt.
# Declared here so Silver models reference them via source() and appear in the lineage graph.
#
# Tables land in phase 1. Until then these are documentation only -- deliberately with no
# `tests:` keys, because `dbt build` runs source tests eagerly and a not_null test against a
# table that does not exist yet fails the build rather than reporting anything useful. Column
# tests get added in phase 1, in the same change that creates the tables they check.

sources:
  - name: bronze
    schema: bronze
    description: >
      Raw API responses, append-only, stored as received. The only copy that will ever exist
      for OpenSky: /states/all returns the current snapshot only, so an uncaptured moment is
      unrecoverable.

    tables:
      - name: raw_opensky_states
        description: >
          One row per captured /states/all response. The payload is a JSONB array of bare
          positional arrays -- there are no field names on the wire, position is the schema.
          Element 5 is longitude and element 6 is latitude, the reverse of the source spec's
          "latitude, longitude" phrasing.
        columns:
          - name: captured_at
            description: When this snapshot was fetched. Not the aircraft position time.
          - name: payload
            description: Verbatim response body, `{time, states[]}`.
          - name: sampling_interval_seconds
            description: >
              Polling interval in force for this capture. Load-bearing, not metadata: ADI is a
              ratio of observed to baseline computed from the same source, so a systematic
              undercount cancels only while the interval is constant. A change here
              invalidates cross-period comparison.

      - name: raw_acled_events
        description: >
          Conflict events from acleddata.com/api/acled/read. Blocked as of 2026-08-03: the
          account authenticates but every /api/*/read returns 403.
        columns:
          - name: event_id_cnty
            description: ACLED business key.
          - name: payload
            description: >
              Verbatim event JSON. Note `event_date` is a DATE, not a timestamp, and
              `time_precision` (1=day, 2=week, 3=month) governs whether the +/-12 h exposure
              window is meaningful for a given row.

      - name: raw_weather_obs
        description: >
          ERA5 reanalysis from the Copernicus Climate Data Store. ECMWF's dataset, not NOAA's
          as the source spec states. Arrives as GRIB/NetCDF, so this table holds extracted
          grid-cell rows rather than a raw payload.
        columns:
          - name: era5_grid_cell
            description: 0.25-degree cell identifier. Sixteen of these per 1-degree analysis cell.
          - name: observation_ts
            description: Hourly observation time, UTC.
          - name: pressure_level_hpa
            description: >
              NULL for single-level (surface) variables, 250 for winds aloft. Surface wind at
              10 m is near-irrelevant to an aircraft at 10,600 m, so the 250 hPa level is what
              the weather-adjusted baseline actually needs.
