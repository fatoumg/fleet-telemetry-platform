version: 2

# Bronze tables, owned by the CDC consumer (src/fleet_telemetry/load/), not by dbt.
# Declared here so Silver models reference them via source() and appear in the lineage graph.
#
# Tables land in phase 2, created by src/fleet_telemetry/load/schema.py. The `tests:` keys below
# arrive in the same change, as the previous version of this header promised: `dbt build` runs
# source tests eagerly, so a not_null test against a table that does not exist fails the build
# rather than reporting anything useful.
#
# EVERY SCALAR COLUMN HERE IS TEXT, INCLUDING THE OBVIOUSLY NUMERIC ONES. They are generated
# columns, and a cast inside GENERATED ALWAYS is evaluated on INSERT -- so a device sending a
# ping_id of "banana" would raise and take the whole batch with it, making Bronze reject exactly
# the malformed evidence it exists to keep. Postgres 16 has no TRY_CAST. Silver casts, where a
# bad value is a failing test rather than lost data.

sources:
  - name: bronze
    schema: bronze
    description: >
      Raw Debezium change events, append-only, stored as received. A Kafka topic has a
      retention window rather than a memory, so an unconsumed event is gone -- Bronze is the
      durable record.

    tables:
      - name: raw_ping_events
        description: >
          One row per GPS ping as received by the application. High volume: roughly 860k rows
          per simulated day at 100 vehicles pinging every 5 seconds. The Silver model
          deduplicates on ping_id.
        columns:
          - name: ping_id
            description: >
              Client-generated UUID, the idempotency key. A retrying device resends the same
              ping_id, so deduplication is exact rather than heuristic.
          - name: sequence_no
            description: >
              Monotonic per device. Not redundant with the timestamps: a gap in the sequence
              proves data loss, whereas an unchanging position with no gap proves the vehicle
              stopped. That is what makes "no data" and "no activity" distinguishable from the
              data itself rather than inferred.
          - name: device_ts
            description: >
              When the device recorded the reading, by its own clock. NOT TRUSTWORTHY --
              device clocks drift and are sometimes badly wrong. Skew correction happens in
              Gold, because it is an estimate whose method will be revised and revising it
              must not require reprocessing every raw row.
          - name: server_ts
            description: When the application received it. Trustworthy; server clock.
          - name: op
            description: >
              Debezium operation. Only c (create) and r (snapshot read) are expected here --
              pings is append-only, so a u or a d arriving is itself a finding rather than
              something to handle.
          - name: _kafka_offset
            description: >
              The broker's coordinate for this message, and Bronze's deduplication key. The
              application already removed device retries with ON CONFLICT (ping_id) DO NOTHING,
              so a duplicate reaching Bronze can only be a redelivery -- which this identifies
              exactly and ping_id does not, being null for deletes and shared between a create
              and any later re-snapshot of the same row.

              The `unique` test below is only correct because this topic has ONE partition,
              pinned by topic.creation.default.partitions in
              docker/debezium/fleet-connector.json. Offsets restart from zero in every new
              partition, so a second partition would make this test fail on data that is
              perfectly valid. The real key is (_kafka_partition, _kafka_offset), which is what
              the unique index in load/schema.py actually enforces; raise the partition count
              and this test must become a combination test.
            tests:
              - not_null
              - unique
          - name: _ingested_at
            description: When Bronze wrote the row.
            tests:
              - not_null
          - name: payload
            description: >
              The whole Debezium envelope. THIS FILE IS NOT AN INVENTORY OF AVAILABLE FIELDS, it
              is a list of the PROJECTED ones -- everything else is still there, one #>> away.
              stg_pings reads vehicle_id, latitude, longitude, speed_kmh and heading_deg straight
              out of `after`, and none of them appear as columns above. A reader who trusts the
              column list as an inventory will conclude those fields do not exist.
          - name: parse_error
            description: >
              Non-null means the bytes never became JSON, so there is no after-image to read.
              Such rows go to stg_rejected_rows, never to stg_pings.

              CAREFUL with the companion check: `payload -> 'after' IS NULL` does NOT detect a
              delete. Debezium emits `"after": null`, so `->` returns jsonb 'null' rather than
              SQL NULL -- verified FALSE on a real delete at offset 172808. The predicate that
              works is jsonb_typeof(payload -> 'after') = 'null'.

      - name: raw_cdc_entities
        description: >
          Debezium change events for the mutable entities -- drivers, vehicles, depots, jobs.
          Carries before and after images plus an op code (c/u/d/r), which is what allows Gold
          to build Type 2 dimensions that capture every committed change. A dbt snapshot polls
          on a schedule and would miss any change that happens between two runs.
        columns:
          - name: source_table
            description: Originating OLTP table.
          - name: op
            description: Debezium operation - c=create, u=update, d=delete, r=snapshot read.
          - name: before
            description: >
              Row image prior to the change; null for creates.

              ITS ABSENCE IS NOT EMPTY, IT IS FABRICATED. These four tables are REPLICA IDENTITY
              FULL so the real old row is logged -- but on any volume created before 2026-08-12
              those ALTERs never ran, and Debezium fills the gap with TYPE DEFAULTS: plate '',
              capacity 0, created_at 1970-01-01 (docs/known-issues.md, section 1). The primary key
              is the one field that is real in that case, which is all stg_rejected_rows needs
              from it. Anything in the Gold ticket that reads the rest inherits the problem.
          - name: after
            description: Row image after the change; null for deletes.
          - name: parse_error
            description: >
              Non-null means the bytes never became JSON. Such rows go to stg_rejected_rows.
              Unlike the two append-only streams, the entity models do NOT reject a row for a
              missing after-image: a delete is expected here and its key comes from `before`.
          - name: source_ts_ms
            description: >
              Commit time from the OLTP write-ahead log, not the time the consumer saw it.
              This is the event time for SCD Type 2 validity ranges. Text, not bigint -- see
              the header.
          - name: _kafka_offset
            description: >
              Broker coordinate. Four topics land in this table, so uniqueness here is
              (_topic, _kafka_partition, _kafka_offset) rather than the offset alone.
            tests:
              - not_null
          - name: _ingested_at
            description: When Bronze wrote the row.
            tests:
              - not_null

      - name: raw_job_events
        description: >
          Append-only job status transitions. Out-of-order arrival is expected here, and the
          state machine must be validated rather than assumed -- the simulator deliberately
          emits deliveries that arrive before their own pickup.
        columns:
          - name: job_id
            description: Business key of the job.
          - name: from_status
            description: Status before the transition; null for the initial event.
          - name: to_status
            description: Status after the transition.
          - name: _kafka_offset
            description: Broker coordinate, and Bronze's deduplication key. See raw_ping_events.
            tests:
              - not_null
              - unique
          - name: _ingested_at
            description: When Bronze wrote the row.
            tests:
              - not_null

      - name: poll_rows
        description: >
          Output of the naive batch poller (src/fleet_telemetry/ingest/poller.py), kept so the
          two ingestion paths can be diffed against one simulator run. NOT a source for any
          Silver model, deliberately: it holds current-state row images, so it has no op code
          and no before-image, and it is missing every change that happened between two polls
          plus every delete that ever occurred. The absence is the finding -- see
          docs/learn/02-ingestion.md.
        columns:
          - name: source_table
            description: Which OLTP table the row image came from.
          - name: row_image
            description: The row exactly as the poller selected it. Current state, not a change.
          - name: watermark_value
            description: >
              The watermark value that caused this row to be selected. Kept so a leaked
              watermark is diagnosable after the fact rather than merely suspected.

  # ------------------------------------------------------------------------------------
  # The second source, and the first that is not bronze.
  # ------------------------------------------------------------------------------------
  #
  # Note the schema resolves to bare `truth` rather than `silver_truth`: sources take their schema
  # from the key below verbatim, because macros/generate_schema_name.sql applies only to nodes dbt
  # BUILDS. Confirmed the same way the existing bronze source is -- see that macro's header, which
  # lists the concatenation victims as the three model layers only.

  - name: truth
    schema: truth
    description: >
      What the simulator INTENDED to emit, written by the simulator itself
      (src/fleet_telemetry/truth.py) rather than by any ingestion path. Not a medallion layer: it
      is the reference the layers are checked against, and the only one originating outside the
      pipeline. Every other assertion in this project can pass while data is quietly lost, because
      Bronze is the earliest thing they can see and Bronze is downstream of the loss.

      EVERY COLUMN HERE IS TYPED, the exact opposite of the all-text rule at the top of this file,
      and the inversion is deliberate. Bronze is text because it must never reject the malformed
      evidence it exists to keep. These values are constructed by our own code immediately before
      the insert, so a cast that fails is a bug in the recorder and the loudest possible failure is
      what we want. Aligning the two would move every such failure out of the simulator, where it
      is a bug report, and into the diff, where it is an unexplained missing row.

    tables:
      - name: intended_pings
        description: >
          One row per reading the simulator formed the intent to send, whether or not it went out.
          Populated only by runs started with `--truth`; a run without the flag leaves no rows, and
          the diff then has nothing to compare. That is why it holds vacuously in CI and on a fresh
          clone rather than failing there.
        columns:
          - name: ping_id
            description: >
              The device-generated UUID, and the ONLY join key into silver.stg_pings. It is an
              unseeded uuid4 (simulator/run.py:218), so it cannot be recomputed from the seed --
              a run that did not record it is unverifiable afterwards.
            tests:
              - not_null
              - unique
          - name: run_id
            description: >
              Which simulator process produced this row, and load-bearing for the diff's bound.
              Two same-seed runs differ only in ping_id: sequence numbers resume from the database
              rather than restarting, and two backfill windows OVERLAP in device_ts because each
              walks from now-span to now. Without run_id there is no way to tell one run's arrival
              frontier from another's, and that frontier is the whole basis of the bound.
            tests: [not_null]
          - name: seed
            description: The RNG seed the run was started with. Provenance, not a key.
            tests: [not_null]
          - name: vehicle_id
            description: Part of the declared grain, with run_id and sequence_no.
            tests: [not_null]
          - name: sequence_no
            description: >
              What the device claimed as its counter. Part of the declared grain, asserted in
              tests/assert_intended_pings_unique_on_run_vehicle_and_sequence.sql.
            tests: [not_null]
          - name: intended_device_ts
            description: >
              The device_ts value actually put on the wire. Compared for EQUALITY against
              silver.stg_pings.device_ts, so it must never be re-derived or re-rounded.
            tests: [not_null]
          - name: truth_ts
            description: >
              The real instant the reading describes. Identical to intended_device_ts on a clean
              run; the two diverge the moment a clock-skew flag exists. Recording both is what
              makes skew measurable rather than merely visible.
            tests: [not_null]
          - name: emitted
            description: >
              False when the intent was formed and deliberately not sent -- the sequence-gap
              pathology, which does not exist yet. Always true today. The diff filters on it, so an
              unemitted row is correctly NOT expected to appear in Silver.
            tests: [not_null]
          - name: pathology
            description: >
              Which flag caused this row to diverge from clean behaviour; null when clean, which is
              every row today. No not_null test, for that reason.
          - name: latitude
            description: Raw degrees, WGS84, exactly as sent. NOT NULL in the OLTP.
            tests: [not_null]
          - name: longitude
            description: Raw degrees, WGS84, exactly as sent. NOT NULL in the OLTP.
            tests: [not_null]
          - name: speed_kmh
            description: >
              Nullable, matching the OLTP. No not_null test: a nullable column that happens to be
              full today is a promise nobody made.
          - name: heading_deg
            description: Nullable, same reasoning as speed_kmh.
