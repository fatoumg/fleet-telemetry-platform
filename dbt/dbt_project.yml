name: aviation_conflict
version: 0.1.0
config-version: 2

profile: aviation_conflict

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: target
clean-targets: ["target", "dbt_packages"]

models:
  aviation_conflict:
    # One schema per medallion layer, matching docker/warehouse/init.sql. Layer names are
    # absolute (+schema with a custom generate_schema_name macro would prefix them).
    staging:
      +schema: silver
      # Silver is cheap to rebuild and its logic changes rarely -- views keep it honest,
      # since a stale table would silently diverge from bronze.
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  aviation_conflict:
    +schema: silver

# Applied to every model so a failing test blocks the build rather than warning into a log
# nobody reads. Grain assertions are the reason this is `error`: fan-out silently inflates
# every downstream number, so it must break the pipeline.
tests:
  aviation_conflict:
    +severity: error

vars:
  # Analysis parameters, deliberately Gold-layer configuration rather than constants.
  # Spec section 9 defends 25 km from a 10-100 km threat range, which concedes it is a
  # judgment call -- so changing it must cost one mart rebuild, not a Silver reprocess.
  conflict_buffer_km: 25
  exposure_window_hours: 12

  # ADI denominator guard. Below this baseline, ADI is NULL with a reason code rather than a
  # number: a true baseline of 0.4 would divide by ~0, and a baseline of 1 swings ADI by
  # +/-100% on a single aircraft. Low-traffic airspace is exactly where conflicts happen.
  min_baseline_flights: 20

  # Rolling baseline window, and the gap before a conflict that keeps the baseline
  # uncontaminated by the event it is meant to be a counterfactual for.
  baseline_window_days: 30
  baseline_lag_days: 30
