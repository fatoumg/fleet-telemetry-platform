name: fleet_telemetry
version: 0.1.0
config-version: 2

profile: fleet_telemetry

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: target
clean-targets: ["target", "dbt_packages"]

models:
  fleet_telemetry:
    # One schema per medallion layer, matching docker/warehouse/init.sql.
    #
    # These names are absolute ONLY because macros/generate_schema_name.sql overrides dbt's
    # built-in, which CONCATENATES target.schema with +schema. Under `schema: silver` in
    # profiles.yml, the built-in resolved this to `silver_silver` -- measured, before that macro
    # existed. `dbt build` reports success either way and the silver schema simply stays empty,
    # so delete that macro and every model in this file moves without an error. See its header.
    staging:
      +schema: silver
      # Silver is cheap to rebuild and its logic changes rarely -- views keep it honest,
      # since a stale table would silently diverge from bronze.
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  fleet_telemetry:
    +schema: silver

# Applied to every model so a failing test blocks the build rather than warning into a log
# nobody reads. Grain assertions are the reason this is `error`: fan-out silently inflates
# every downstream number, so it must break the pipeline.
tests:
  fleet_telemetry:
    +severity: error

vars:
  # ------------------------------------------------------------------------------------
  # Lateness policy -- the core of phase 4
  # ------------------------------------------------------------------------------------

  # How late an event may arrive and still be folded into its true event-time window.
  # Beyond this it goes to quarantine rather than being dropped: a silent discard is how an
  # undercount becomes invisible.
  lateness_bound_hours: 6

  # How far back incremental models rebuild on each run.
  #
  # MUST EXCEED lateness_bound_hours. If the lookback is shorter, an event that arrives
  # within the accepted bound still lands outside the window being rebuilt, and is silently
  # lost -- the pipeline reports success and the number is quietly wrong. This is the
  # single easiest way to break this project.
  incremental_lookback_days: 3

  # ------------------------------------------------------------------------------------
  # Trip reconstruction
  # ------------------------------------------------------------------------------------

  # Gap between consecutive pings that ends a trip rather than counting as a pause.
  trip_gap_minutes: 15

  # A vehicle reporting but not moving further than this is stationary, not travelling.
  stationary_speed_kmh: 3

  # ------------------------------------------------------------------------------------
  # Coverage guard
  # ------------------------------------------------------------------------------------

  # Below this share of expected pings in an hour, the cell reads "no data" rather than
  # "no activity". Sequence-number gaps make this measurable rather than inferred.
  min_reporting_coverage: 0.6
