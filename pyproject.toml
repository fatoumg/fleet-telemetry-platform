[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleet-telemetry-platform"
version = "0.1.0"
description = "End-to-end data platform: an event-producing application, CDC, and a medallion warehouse that stays correct under late and out-of-order arrival"
readme = "README.md"
requires-python = ">=3.13"

# The base install is deliberately tiny: this project calls no external APIs, so there is no
# HTTP client here. Everything heavier is an extra, scoped to the phase that needs it.
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase 0. The event-producing application and its load generator.
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # The simulator's HTTP client. Belongs here rather than in [dev], where it lived until the
    # container exposed the mistake: on a developer's machine `.[app,dev]` hides the
    # difference, but an image built with `.[app]` alone crash-looped on ModuleNotFoundError.
    # FastAPI's TestClient needs it too, and is satisfied by this.
    "httpx>=0.28",
]
# Phase 1-2. Consuming CDC and loading the warehouse.
warehouse = [
    "psycopg[binary]>=3.2",
    "dbt-postgres>=1.8",
    "confluent-kafka>=2.6",
]
# Phase 6. Pinned to Airflow 3.x; the 2.x -> 3.x task API differs.
airflow = [
    "apache-airflow>=3.0,<4.0",
]
dev = [
    "pytest>=8.0",
    # Keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml, or the hook and a
    # local `ruff check` will disagree about which rules exist.
    "ruff>=0.16",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]

[project.scripts]
fleet-config = "fleet_telemetry.config:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_telemetry"]

# --------------------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "app", "simulator"]
# Editor and agent tooling, not project source. `.claude/scripts/statusline.py` is a vendored
# template regenerated by `/ccw:statusline-setup`, so patching it to satisfy our lint rules
# would be undone the next time that command runs -- and `ruff check .` in CI would fail on a
# file nothing in the pipeline imports. Excluded rather than fixed, deliberately.
#
# Implementation plans are excluded because ruff formats Python code blocks inside Markdown,
# and a plan's snippets are deliberately fragmentary -- a few lines to splice into an existing
# function, not a runnable module. Formatting them is not merely noisy, it is wrong: given the
# tuple fragment in the phase-2 plan's `describe()` step, ruff wrapped it in an extra pair of
# parentheses to make it parse, silently changing what the snippet instructs. Documentation
# that ships runnable examples (docs/learn/, README.md) stays in scope on purpose.
extend-exclude = [".claude", "docs/superpowers/plans"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "PTH",      # prefer pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Exploration scripts print findings as their entire purpose.
"simulator/*" = ["T201"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# WITHOUT THIS, `pytest` AND `python -m pytest` DISAGREE, AND CI RUNS THE ONE THAT FAILS.
#
# Only src/fleet_telemetry is packaged (see tool.hatch.build.targets.wheel), so `app` and
# `simulator` are importable only when the repository root is on sys.path. `python -m pytest`
# puts it there as sys.path[0]; bare `pytest` does not. So three test modules that import
# `simulator` collected fine for anyone typing `python -m pytest` and failed with
# ModuleNotFoundError for CI, which runs bare `pytest` -- every CI run since 2026-08-10, while
# local runs looked green.
#
# NOT fixed by adding app/ and simulator/ to the wheel: they are the source system, not library
# code, and shipping them would make an install of this package export a FastAPI app. The path
# only needs to exist while tests run, which is exactly what this option does.
pythonpath = ["."]
markers = [
    "integration: needs docker services running; deselect with -m 'not integration'",
]
